[package]
name = "clipboardx-sync-server"
version = "0.1.0"
edition = "2024"
publish = false
description = "ClipboardX's sync server: stores the vault's ciphertext, never a key"

[lib]
path = "src/lib.rs"

[[bin]]
name = "clipboardx-sync-server"
path = "src/main.rs"

[dependencies]
clipboardx-sync-proto = { path = "../crates/sync-proto" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
getrandom = "0.4"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
reqwest = { version = "0.13", features = ["json"] }
tokio-tungstenite = "0.27"
futures-util = "0.3"
tempfile = "3"
