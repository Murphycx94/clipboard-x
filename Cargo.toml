[package]
name = "clipboardx"
version = "0.3.0"
description = "ClipboardX - Clipboard History Manager"
edition = "2024"
publish = false

[workspace]
members = ["crates/sync-proto", "server"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "clipboardx"
path = "src/main.rs"

[dependencies]
nsh-core = "0.5.0"
nsh-base = "0.5.0"
log = "0.4.35"
serde_json = "1.0.154"
sha2 = "0.11.1"
hex = "0.4.3"
base64 = "0.23.1"
simplelog = "0.12.2"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
oxipng = { version = "10.2.1", default-features = false, features = ["parallel"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.13.5", features = ["blocking", "json", "multipart"] }
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
zeroize = { version = "1.9.1", features = ["derive"] }
totp-rs = { version = "6.0.0", features = ["otpauth"] }
uuid = { version = "1.29.2", features = ["v4"] }
getrandom = "0.4"
clipboardx-sync-proto = { version = "0.1.0", path = "crates/sync-proto" }
tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
bip39 = { version = "3.0.0", features = ["chinese-simplified", "zeroize"] }

# The desktops' data directory, clipboard, global shortcut and menu-bar icon.
[target.'cfg(not(target_os = "android"))'.dependencies]
dirs = "7.0.0"
arboard = "3.7.0"
global-hotkey = "0.9.0"
tray-icon = "0.26.1"

# Android's Keystore, biometric prompt and clipboard flags, through JNI.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
nsh-platform-macos = { version = "0.5.0", default-features = false }
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
objc2-local-authentication = "0.3.2"
security-framework = "3.7.0"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.5.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.5.0", default-features = false }

[dev-dependencies]
clipboardx-sync-server = { path = "server" }
nsh-engine = "0.5.0"
nsh-testing = "0.5.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "macros"] }

# Key derivation is unusably slow unoptimized; keep debug builds and tests quick.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
