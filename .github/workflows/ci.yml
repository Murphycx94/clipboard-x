name: CI

# Every push and pull request: format, lint and test, then package a
# universal macOS app and an Android APK (workflow artifacts). Pushes to
# main whose version (Cargo.toml) has no tag yet also publish a GitHub
# release v<version>, which the app's update check finds.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main: it may be publishing a release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets -- -D warnings

      # The app, the sync server and the protocol; includes the headless UI
      # tests and the end-to-end sync tests against a local server. They
      # keep off the clipboard and the keychain by themselves.
      - run: cargo test --workspace

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      should_release: ${{ steps.read.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version and look for its tag
        id: read
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          nsh_version=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' nsh.json | head -1)
          if [ -z "$version" ]; then
            echo "::error::no version in Cargo.toml"
            exit 1
          fi
          if [ "$version" != "$nsh_version" ]; then
            echo "::error::Cargo.toml ($version) and nsh.json ($nsh_version) versions differ"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --tags origin "refs/tags/v$version" | grep -q .; then
            echo "v$version is already released"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "will release v$version"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  package:
    name: package macOS
    needs: [check, version]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: universal

      - name: Build the universal app and disk image
        run: scripts/bundle-macos.sh --universal --dmg

      - name: Zip the app, with checksums
        run: |
          ditto -c -k --keepParent dist/ClipboardX.app \
            "dist/ClipboardX-${{ needs.version.outputs.version }}-macos-universal.zip"
          cd dist && for f in ClipboardX-*.dmg ClipboardX-*-macos-universal.zip; do
            shasum -a 256 "$f" > "$f.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ClipboardX-${{ needs.version.outputs.version }}-macos
          path: |
            dist/ClipboardX-*.dmg
            dist/ClipboardX-*-macos-universal.zip
            dist/ClipboardX-*.sha256
          if-no-files-found: error

  android:
    name: package Android
    needs: [check, version]
    runs-on: ubuntu-latest
    env:
      # The CLI builds this crate against its own NSH: keep it at the
      # version Cargo.toml depends on.
      NSH_VERSION: v0.5.0
    steps:
      - uses: actions/checkout@v4

      # `nsh package` builds the crate for the host too (to describe the
      # app): on Linux, NSH's GTK 4 platform and the desktop's tray icon
      # (GTK 3).
      - name: Install GTK and GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libgtk-3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      # The bridge (android/java) is compiled by build.rs with javac; the
      # runner's Android SDK has the platform, build-tools (d8) and NDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      # The library only: the dev-dependencies (the headless UI tests)
      # do not build for Android. SQLite's C needs the NDK's compiler.
      - name: Clippy for Android
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          export CC_aarch64_linux_android="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          export AR_aarch64_linux_android="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          cargo clippy --lib --target aarch64-linux-android -- -D warnings

      - name: Install NSH
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Release-signed when the keystore secrets are set; a release refuses
      # the debug key.
      - name: Package the APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NSH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SHOULD_RELEASE: ${{ needs.version.outputs.should_release }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            export ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE"
          fi
          if [ "$SHOULD_RELEASE" = true ]; then
            scripts/package-android.sh --release
          else
            scripts/package-android.sh
          fi
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: ClipboardX-${{ needs.version.outputs.version }}-android
          path: |
            dist/ClipboardX-*-android.apk
            dist/ClipboardX-*-android.apk.sha256
          if-no-files-found: error

  server:
    name: package sync server (Linux)
    needs: [check, version]
    runs-on: ubuntu-latest
    env:
      NAME: clipboardx-sync-server-${{ needs.version.outputs.version }}-linux-x86_64
    steps:
      - uses: actions/checkout@v4

      - run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: server-musl

      # Static: runs in any LXC whatever its C library.
      - name: Build
        run: cargo build --release -p clipboardx-sync-server --target x86_64-unknown-linux-musl

      - name: Package with the deploy kit
        run: |
          mkdir -p "dist/$NAME"
          cp target/x86_64-unknown-linux-musl/release/clipboardx-sync-server "dist/$NAME/"
          cp server/deploy/install.sh server/deploy/clipboardx-sync.service \
            server/deploy/clipboardx-sync.env.example server/deploy/README.md "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          (cd dist && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: clipboardx-sync-server-linux
          path: |
            dist/${{ env.NAME }}.tar.gz
            dist/${{ env.NAME }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: release
    needs: [version, package, android, server]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ClipboardX-${{ needs.version.outputs.version }}-macos
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: ClipboardX-${{ needs.version.outputs.version }}-android
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: clipboardx-sync-server-linux
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            macOS 14 及以上，Apple 芯片与 Intel 通用。

            应用未经 Apple 公证（ad-hoc 签名），首次打开时系统可能提示"无法验证开发者"或"已损坏"：
            在"访达"中按住 Control 点按应用并选择"打开"，或在终端运行
            `xattr -dr com.apple.quarantine /Applications/ClipboardX.app`。

            `ClipboardX-…-android.apk` 是安卓版（Android 8 及以上），下载后在手机上安装；首次安装需允许浏览器或文件管理器"安装未知应用"。

            `clipboardx-sync-server-…-linux-x86_64.tar.gz` 是密码本云同步的服务端（静态编译），部署说明见压缩包内的 README.md。
          files: |
            artifacts/ClipboardX-*.dmg
            artifacts/ClipboardX-*-macos-universal.zip
            artifacts/ClipboardX-*-android.apk
            artifacts/clipboardx-sync-server-*-linux-x86_64.tar.gz
            artifacts/*.sha256
